{% extends 'base.html' %}
{% block content %}
<div class="page-header">
    <div>
        <h1 class="page-title">Recuperar Contraseña</h1>
        <p class="page-description">Ingrese su correo electrónico y recibirá instrucciones para restablecer su acceso.</p>
    </div>
</div>

<div class="form-card">
    <div class="card shadow-md">
        <div class="card-body" style="padding: 2.5rem;">
            <div class="d-flex align-items-center gap-3 mb-4" style="padding-bottom: 1.5rem; border-bottom: 1px solid var(--border);">
                <div style="width: 52px; height: 52px; border-radius: var(--radius-md); background: rgba(245, 158, 11, 0.08); color: #f59e0b; display: flex; align-items: center; justify-content: center;">
                    <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
                </div>
                <div>
                    <h3 style="font-family: 'Plus Jakarta Sans', sans-serif; font-size: 1.25rem; font-weight: 700; color: var(--text-main); margin: 0;">Restablecer Acceso</h3>
                    <p class="text-muted" style="margin: 0; font-size: 0.88rem;">Le enviaremos un enlace seguro a su correo.</p>
                </div>
            </div>
            <form method="post">
                {% csrf_token %}
                {% for field in form %}
                <div class="form-group">
                    <label class="form-label" for="{{ field.id_for_label }}">{{ field.label }}</label>
                    {{ field }}
                </div>
                {% endfor %}
                <button class="btn btn-primary w-100" style="margin-top: 1rem;">Enviar Instrucciones</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
