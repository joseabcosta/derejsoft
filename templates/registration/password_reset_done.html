{% extends 'base.html' %}
{% block content %}
<div class="form-card" style="margin-top: 3rem;">
    <div class="card shadow-md">
        <div class="card-body d-flex flex-column align-items-center" style="padding: 3rem 2.5rem; text-align: center;">
            <div style="width: 64px; height: 64px; border-radius: 50%; background: rgba(16, 185, 129, 0.1); color: #10b981; display: flex; align-items: center; justify-content: center; margin-bottom: 1.5rem;">
                <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>
            </div>
            <h3 style="font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 700; font-size: 1.35rem; color: var(--text-main); margin-bottom: 0.5rem;">Instrucciones Enviadas</h3>
            <p class="text-muted" style="max-width: 400px; margin-bottom: 1.5rem;">Le hemos enviado un correo electrónico con las instrucciones para restablecer su contraseña. Por favor revise su bandeja de entrada.</p>
            <a class="btn btn-primary" href="{% url 'login' %}">Volver al Inicio de Sesión</a>
        </div>
    </div>
</div>
{% endblock %}
